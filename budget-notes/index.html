<!DOCTYPE html>
<html lang="en-GB" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="BUDGET Notes — a monthly budget planner you set once and it carries forward." />
  <meta name="theme-color" content="#080b1a" />
  <title>BUDGET Notes</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="apple-touch-icon" href="../assets/favicon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #080b1a;
    }

    .cover-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      padding-bottom: max(22px, env(safe-area-inset-bottom));
    }

    .cover-image {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .enter-btn {
      position: relative;
      z-index: 10;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 229, 212, 0.5);
      background: rgba(8, 11, 26, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .enter-btn:hover,
    .enter-btn:focus {
      background: rgba(0, 229, 212, 0.15);
      border-color: rgba(0, 229, 212, 0.9);
      transform: scale(1.06);
      outline: none;
    }

    .enter-btn svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #00e5d4;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 3C Watermark Standard — landing page, no toolbar here, so it sits at the bottom */
    .cover-credit {
      position: relative;
      z-index: 10;
      max-width: 92%;
      margin: 0;
      font-size: 0.62rem;
      line-height: 1.5;
      letter-spacing: 0.02em;
      text-align: center;
      color: rgba(240, 244, 255, 0.78);
      text-shadow: 0 1px 6px rgba(8, 11, 26, 0.9);
    }

    /* ── Desktop only: contained app-card instead of full-bleed (same as Dash Notes).
         Mobile (below 768px) is untouched. ── */
    @media (min-width: 768px) {
      html, body { overflow: auto; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
      }
      #cover-root {
        position: relative;
        width: 100%;
        max-width: 420px;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .cover-image {
        position: static;
        width: 100%;
        height: auto;
        aspect-ratio: 3 / 4;
        display: block;
      }
      .cover-wrap {
        position: static;
        inset: auto;
        padding: 22px;
        background: rgba(255, 255, 255, 0.03);
      }
    }
  </style>
</head>
<body>

  <div id="cover-root">
    <img
      src="../assets/budget-notes-cover.png"
      alt="BUDGET Notes"
      class="cover-image"
      onerror="this.style.background='#080b1a'" />

    <div class="cover-wrap">
      <a href="app.html" class="enter-btn" aria-label="Enter BUDGET Notes">
        <svg viewBox="0 0 24 24">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
      <p class="cover-credit">Designed and Built with ❤ by Claude (Anthropic) × Chef Anica · 3C Thread To Success™ Cooking Lab 🧪👨🍳</p>
    </div>
  </div>

</body>
</html>
