<!DOCTYPE html>
<html lang="en-GB" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>SOURCE Notes — Enter</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/source.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-body">
    <div class="login-card">
        <img src="../assets/favicon.png" alt="" class="crest" onerror="this.style.display='none'">
        <h1><span class="logo-dash">SOURCE</span><span class="logo-notes">Notes</span></h1>
        <p class="subtitle">Private · Chef only</p>
        <div class="divider"></div>
        <button class="btn primary wide" id="btnLogin" type="button">
            <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
            <span>Enter with GitHub</span>
        </button>
        <p class="status-msg" id="statusMsg"></p>
        <p class="tagline">Think it. Do it. Own it.</p>
    </div>

    <script type="module">
        import { SUPABASE_URL, SUPABASE_ANON_KEY } from './js/config.js';
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const msg = document.getElementById('statusMsg');

        // Already signed in on this browser → straight to the shelves
        client.auth.getSession().then(({ data }) => { if (data && data.session) location.replace('index.html'); });

        document.getElementById('btnLogin').addEventListener('click', async () => {
            msg.textContent = 'Opening secure access…';
            const { error } = await client.auth.signInWithOAuth({
                provider: 'github',
                options: { redirectTo: new URL('index.html', location.href).href }
            });
            if (error) msg.textContent = '❌ ' + error.message;
        });
    </script>
</body>
</html>
