<!DOCTYPE html>
<html lang="en-GB" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#14054d">
    <title>SOURCE Notes</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="css/source.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body data-view="entry">

    <!-- Watermark — above the toolbar, before the header element (entry page) -->
    <div class="watermark" id="watermark">Designed and Built with ❤ by Claude (Anthropic) × Chef Anica · 3C Thread To Success™ Cooking Lab 🧪👨🍳</div>

    <!-- Toolbar — same information as the other notes apps; British English only, so no language switch -->
    <header class="toolbar">
        <a class="brand" id="brand" href="#" aria-label="SOURCE Notes — shelves">
            <img src="../assets/favicon.png" alt="" width="26" height="26" style="border-radius:6px;" onerror="this.style.display='none'">
            <span class="brand-text"><span class="logo-dash">SOURCE</span><span class="logo-notes">Notes</span></span>
        </a>
        <div class="tool-right">
            <span id="cloud-mark" hidden data-state="saving" role="img" aria-label="Connecting to the cloud…" title="Connecting to the cloud…">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9.5a4.25 4.25 0 0 1-.5 8.5H7z"/>
                    <path class="cm-tick" d="M9.2 13.6l2.2 2.2 4.1-4.2"/>
                    <path class="cm-bang" d="M12 11.2v3.2M12 16.6v.1"/>
                </svg>
            </span>
            <a class="tool-btn muted" id="btnDash" href="../app.html" title="Back to DASH Notes" aria-label="Back to DASH Notes">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                <span class="dash-text">DASH Notes</span>
            </a>
            <button class="tool-btn" id="btnIndex" type="button">Index</button>
            <button class="tool-btn muted" id="btnAbout" type="button">About</button>
            <span class="lang-chip" title="British English">🇬🇧 EN</span>
            <span class="user-badge" id="userBadge"></span>
            <button class="icon-btn gold" id="btnExit" type="button" title="Sign out" aria-label="Sign out">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </div>
    </header>

    <main id="view"></main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
