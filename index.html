<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dash Notes — A private thinking space for fast minds." />
  <title>Dash Notes</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #080b1a;
    }

    .cover-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: max(48px, env(safe-area-inset-bottom));
    }

    .cover-image {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .enter-btn {
      position: relative;
      z-index: 10;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 229, 212, 0.5);
      background: rgba(8, 11, 26, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .enter-btn:hover,
    .enter-btn:focus {
      background: rgba(0, 229, 212, 0.15);
      border-color: rgba(0, 229, 212, 0.9);
      transform: scale(1.06);
      outline: none;
    }

    /* Private link: invisible tap area over the diamond in the cover image. Not announced to public users. */
    .diamond-link {
      position: fixed;
      z-index: 5;
      width: 44px;
      height: 44px;
      margin: -22px 0 0 -22px;
      border-radius: 50%;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .enter-btn svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #00e5d4;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Desktop only: contained app-card instead of full-bleed.
         Mobile (below 768px) is completely untouched — same rules as before. ── */
    @media (min-width: 768px) {
      html, body { overflow: auto; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
      }
      #cover-root {
        position: relative;
        width: 100%;
        max-width: 420px;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .cover-image {
        position: static;
        width: 100%;
        height: auto;
        aspect-ratio: 3 / 4;
        display: block;
      }
      .cover-wrap {
        position: static;
        inset: auto;
        padding: 22px;
        background: rgba(255, 255, 255, 0.03);
      }
    }
  </style>
</head>
<body>

  <div id="cover-root">
    <img
      src="assets/dash-notes-cover.png"
      alt="Dash Notes"
      class="cover-image"
      onerror="this.style.background='#080b1a'" />

    <a href="https://anica-blip.github.io/3C-Goal-Tracker/source-notes/index.html"
       class="diamond-link" id="diamond-link" tabindex="-1" aria-hidden="true" rel="noopener" target="_blank"></a>

    <div class="cover-wrap">
      <a href="app.html" class="enter-btn" aria-label="Enter Dash Notes">
        <svg viewBox="0 0 24 24">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
    </div>
  </div>

  <script>
    // Places the private link exactly over the diamond in the cover image (works for the full-bleed
    // phone layout and the contained desktop card). Diamond centre in the 1080 x 1920 cover: x 385, y 620.
    (function () {
      var DX = 385, DY = 620, NW = 1080, NH = 1920;
      var img = document.querySelector('.cover-image');
      var link = document.getElementById('diamond-link');
      if (!img || !link) return;
      function place() {
        var r = img.getBoundingClientRect();
        if (!r.width || !r.height) return;
        var s = Math.max(r.width / NW, r.height / NH);          // object-fit: cover
        var ox = (r.width - NW * s) / 2;                         // object-position: center top
        link.style.left = (r.left + ox + DX * s) + 'px';
        link.style.top  = (r.top + DY * s) + 'px';
      }
      img.addEventListener('load', place);
      window.addEventListener('resize', place);
      window.addEventListener('scroll', place, { passive: true });
      place();
    })();
  </script>

</body>
</html>
